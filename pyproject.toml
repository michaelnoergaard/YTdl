[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytdl"
version = "0.1.0"
description = "YouTube downloader utility for video downloads and audio extraction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "simple-term-menu>=1.6.6",
    "yt-dlp>=2025.6.30",
]

[project.scripts]
ytdl = "ytdl.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.0",
    "ruff>=0.11",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "simple_term_menu"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
